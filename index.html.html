
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日常チェックリスト</title>

<style>
:root {
  --bg: #f4f6f8;
  --white: #ffffff;
  --text: #243447;
  --muted: #69798b;
  --border: #e1e7ed;
  --primary: #405568;
  --green: #219765;
  --green-bg: #eef8f2;
  --red: #a94b4b;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 36px 18px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", "Noto Sans JP", sans-serif;
  line-height: 1.5;
}

main {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
}

header {
  margin-bottom: 28px;
}

h1 {
  margin: 0;
  font-size: clamp(1.65rem, 4vw, 2.1rem);
  font-weight: 750;
  letter-spacing: .04em;
}

.subtitle {
  margin: 8px 0 0;
  color: var(--muted);
}

.panel {
  padding: 22px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 5px 20px rgba(27, 44, 60, .035);
}

.panel + .panel {
  margin-top: 22px;
}

.panel-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 16px;
}

h2 {
  margin: 0;
  font-size: 1.2rem;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.reset {
  padding: 9px 12px;
  color: var(--primary);
  background: white;
  border: 1px solid var(--border);
  border-radius: 9px;
}

.reset:hover {
  background: #f7f9fb;
}

.item-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  list-style: none;
  padding: 0;
  margin: 0;
}

.item {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
  min-height: 76px;
  padding: 12px;
  background: white;
  border: 1px solid transparent;
  border-radius: 9px;
  transition: background .16s, border-color .16s;
}

.item + .item:not(.checked) {
  border-top-color: var(--border);
  border-radius: 0;
}

.item.checked {
  background: var(--green-bg);
  border-color: #dcefe3;
}

.item input[type="checkbox"] {
  appearance: none;
  width: 22px;
  height: 22px;
  margin: 0;
  border: 1.8px solid #c5cfd8;
  border-radius: 6px;
  background: white;
  display: grid;
  place-items: center;
  cursor: pointer;
}

.item input[type="checkbox"]::after {
  content: "";
  width: 5px;
  height: 10px;
  border: solid white;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg) scale(0);
  margin-top: -2px;
}

.item input[type="checkbox"]:checked {
  background: var(--green);
  border-color: var(--green);
}

.item input[type="checkbox"]:checked::after {
  transform: rotate(45deg) scale(1);
}

/* 項目名と日時を常に2行で配置 */
.item-content {
  min-width: 0;
  display: grid;
  grid-template-rows: 1.5em 1.4em;
  align-content: center;
}

.item-name {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 650;
  color: var(--text);
  line-height: 1.5em;
}

.item.checked .item-name {
  color: #246846;
}

/* 日時は常に2行目に配置 */
.timestamp {
  display: block;
  margin: 0;
  color: var(--muted);
  font-size: .84rem;
  line-height: 1.4em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.delete {
  padding: 7px 10px;
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: .85rem;
}

.delete:hover {
  color: var(--red);
  background: #fff7f7;
  border-color: #ead1d1;
}

.empty {
  padding: 24px 10px;
  color: var(--muted);
  text-align: center;
}

.summary {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: .94rem;
}

.summary strong {
  color: var(--green);
  font-weight: 750;
}

.add-form {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}

input[type="text"] {
  width: 100%;
  min-width: 0;
  padding: 12px 14px;
  color: var(--text);
  background: white;
  border: 1px solid #d4dde5;
  border-radius: 9px;
}

input[type="text"]::placeholder {
  color: #9aa7b5;
}

.add {
  flex: 0 0 auto;
  padding: 11px 20px;
  color: white;
  background: var(--primary);
  border: 1px solid var(--primary);
  border-radius: 9px;
  font-weight: 650;
}

.add:hover {
  background: #304456;
}

.save-note {
  margin: 14px 0 0;
  color: var(--muted);
  font-size: .82rem;
}

button:focus-visible,
input:focus-visible {
  outline: 3px solid #b9d6e8;
  outline-offset: 2px;
}

@media (max-width: 520px) {
  body {
    padding: 22px 12px;
  }

  .panel {
    padding: 16px;
  }

  .panel-heading {
    align-items: flex-start;
    flex-direction: column;
  }

  .reset {
    width: 100%;
  }

  .item {
    grid-template-columns: 22px minmax(0, 1fr) auto;
    gap: 10px;
    padding: 12px 8px;
  }

  .add-form {
    flex-direction: column;
  }

  .add {
    width: 100%;
  }
}
</style>
</head>

<body>
<main>
  <header>
    <h1>日常チェックリスト</h1>
    <p class="subtitle">
      日々の実行を記録して、安心の習慣を。
    </p>
  </header>

  <section class="panel">
    <div class="panel-heading">
      <h2>チェックリスト</h2>
      <button class="reset" id="reset-all" type="button">
        すべてのチェックをオフ
      </button>
    </div>

    <ul class="item-list" id="checklist"></ul>

    <div class="summary" id="progress" aria-live="polite"></div>
  </section>

  <section class="panel">
    <h2>項目を追加</h2>

    <form class="add-form" id="add-form">
      <input
        id="new-item"
        type="text"
        maxlength="120"
        placeholder="例：ゴミ出し"
        aria-label="追加する項目名"
        required
      >
      <button class="add" type="submit">追加</button>
    </form>

    <p class="save-note">
      チェック状態や項目は、このブラウザに自動保存されます。
    </p>
  </section>
</main>

<script>
(() => {
  const STORAGE_KEY = "daily-checklist-v1";

  const defaults = [
    {
      id: "default-lock",
      name: "鍵の施錠",
      checked: false,
      checkedAt: null
    },
    {
      id: "default-window",
      name: "窓の施錠",
      checked: false,
      checkedAt: null
    },
    {
      id: "default-light",
      name: "部屋の消灯",
      checked: false,
      checkedAt: null
    }
  ];

  const list = document.getElementById("checklist");
  const progress = document.getElementById("progress");
  const form = document.getElementById("add-form");
  const newItemInput = document.getElementById("new-item");
  const resetAllButton = document.getElementById("reset-all");

  function makeId() {
    return Date.now().toString(36) +
      Math.random().toString(36).slice(2, 9);
  }

  // 保存データを読み込む
  function loadItems() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);

      if (saved === null) {
        return defaults.map(item => ({ ...item }));
      }

      const parsed = JSON.parse(saved);

      if (!Array.isArray(parsed)) {
        return defaults.map(item => ({ ...item }));
      }

      return parsed
        .filter(item =>
          item && typeof item.name === "string"
        )
        .map(item => ({
          id: String(item.id || makeId()),
          name: item.name,
          checked: Boolean(item.checked),
          checkedAt:
            item.checked && item.checkedAt
              ? item.checkedAt
              : null
        }));
    } catch (error) {
      return defaults.map(item => ({ ...item }));
    }
  }

  let items = loadItems();

  // ローカルストレージに保存
  function saveItems() {
    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(items)
      );
    } catch (error) {
      alert(
        "保存できませんでした。ブラウザのストレージ設定をご確認ください。"
      );
    }
  }

  // 日時を日本語形式に変換
  function formatDate(isoString) {
    const date = new Date(isoString);

    if (Number.isNaN(date.getTime())) {
      return "";
    }

    return new Intl.DateTimeFormat("ja-JP", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    }).format(date);
  }

  // 画面を描画
  function render() {
    list.replaceChildren();

    if (items.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent =
        "項目がありません。下から追加してください。";
      list.appendChild(empty);
    }

    items.forEach(item => {
      const li = document.createElement("li");
      li.className =
        "item" + (item.checked ? " checked" : "");

      // チェックボックス
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = item.checked;
      checkbox.id = "check-" + item.id;
      checkbox.setAttribute("aria-label", item.name);

      checkbox.addEventListener("change", () => {
        const target = items.find(
          entry => entry.id === item.id
        );

        if (!target) return;

        target.checked = checkbox.checked;

        // チェック時に日時を記録
        // 解除時は日時を消去
        target.checkedAt = checkbox.checked
          ? new Date().toISOString()
          : null;

        saveItems();
        render();
      });

      // 項目名と日時の表示領域
      const content = document.createElement("div");
      content.className = "item-content";

      const name = document.createElement("label");
      name.className = "item-name";
      name.htmlFor = checkbox.id;
      name.textContent = item.name;

      content.appendChild(name);

      // 日時用の2行目を必ず確保
      const time = document.createElement("div");
      time.className = "timestamp";

      if (item.checked && item.checkedAt) {
        time.textContent = formatDate(item.checkedAt);
      } else {
        // 空白を入れても表示位置が変わらないようにする
        time.textContent = "\u00A0";
      }

      content.appendChild(time);

      // 項目ごとの削除ボタン
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "delete";
      remove.textContent = "削除";
      remove.setAttribute(
        "aria-label",
        item.name + "を削除"
      );

      remove.addEventListener("click", () => {
        if (!confirm(
          "「" + item.name + "」を削除しますか？"
        )) {
          return;
        }

        items = items.filter(
          entry => entry.id !== item.id
        );

        saveItems();
        render();
      });

      li.append(checkbox, content, remove);
      list.appendChild(li);
    });

    // 完了件数を更新
    const completed = items.filter(
      item => item.checked
    ).length;

    progress.replaceChildren();

    progress.appendChild(
      document.createTextNode(items.length + "項目中 ")
    );

    const completedText = document.createElement("strong");
    completedText.textContent = completed + "項目完了";

    progress.appendChild(completedText);
  }

  // 新しい項目を追加
  form.addEventListener("submit", event => {
    event.preventDefault();

    const name = newItemInput.value.trim();
    if (!name) return;

    items.push({
      id: makeId(),
      name,
      checked: false,
      checkedAt: null
    });

    saveItems();
    render();

    newItemInput.value = "";
    newItemInput.focus();
  });

  // すべてのチェックを解除。項目は残す
  resetAllButton.addEventListener("click", () => {
    if (!items.some(item => item.checked)) return;

    if (!confirm(
      "すべてのチェックを解除し、記録日時を消去しますか？"
    )) {
      return;
    }

    items = items.map(item => ({
      ...item,
      checked: false,
      checkedAt: null
    }));

    saveItems();
    render();
  });

  // 初期表示
  render();
})();
</script>
</body>
</html>
